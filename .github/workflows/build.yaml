name: Windows build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: '23.4'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: windows-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Verify perl (Strawberry, not MSYS2)
        shell: pwsh
        run: |
          (Get-Command perl).Source
          perl -e "use Locale::Maketext::Simple; print 'perl ok'"
      - name: Build xodus-cli
        shell: pwsh
        run: cargo build --release -p xodus-cli --features xodus/key-chain-file
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xodus-cli-windows
          path: |
            target/release/xodus-cli.exe
            target/release/*.dll
          if-no-files-found: error
